<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#0b4a24">
<title>You are offline | JAN Poultry</title>
<style>

  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 30px;background:#fbbf0f;color:#2b2200;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/icons/icon-192.png" alt="" width="88" height="88">
  <h1>You are offline</h1>
  <p>We could not reach JAN Poultry. Check your internet connection, then try again. Your cart is safe.</p>
  <button type="button" onclick="location.reload()">Try again</button>

</html>
