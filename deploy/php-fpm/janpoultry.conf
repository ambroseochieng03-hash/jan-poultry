; /etc/php/8.5/fpm/pool.d/janpoultry.conf
; Own pool = own Linux user, own sessions, own limits. Lux is untouched.
[janpoultry]
user  = janpoultry
group = janpoultry

listen       = /run/php/janpoultry.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; LUX comes first on this VM (3.8 GB shared with Lux, Mazook, MariaDB, Redis, NATS).
; JAN Poultry stays small, idle-cheap and lower priority than everything else.
pm                      = ondemand
pm.max_children         = 3
pm.process_idle_timeout = 10s
pm.max_requests         = 300
process.priority        = 10
request_terminate_timeout = 30s
catch_workers_output    = yes

clear_env = yes

php_admin_value[open_basedir]          = /srv/http/janpoultry:/tmp:/var/lib/janpoultry:/usr/share/php
; Sessions live in Redis (DB 2, own key prefix). Fallback if Redis is ever down:
;   session.save_handler = files  /  session.save_path = /var/lib/janpoultry/sessions
php_admin_value[session.save_handler]  = redis
php_admin_value[session.save_path]     = "tcp://127.0.0.1:6379?prefix=jp_sess:&database=2"
php_admin_value[sys_temp_dir]          = /var/lib/janpoultry/tmp
php_admin_value[upload_tmp_dir]        = /var/lib/janpoultry/tmp
php_admin_value[upload_max_filesize]   = 20M
php_admin_value[post_max_size]         = 25M
php_admin_value[memory_limit]          = 128M
php_admin_value[max_execution_time]    = 30
php_admin_value[expose_php]            = Off
php_admin_flag[display_errors]         = off
php_admin_flag[log_errors]             = on
php_admin_value[error_log]             = /var/log/janpoultry/php-error.log
php_admin_flag[allow_url_fopen]        = off
php_admin_flag[allow_url_include]      = off
; Phase D: once ffmpeg/mail move to workers, enable this line:
; php_admin_value[disable_functions]   = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec
