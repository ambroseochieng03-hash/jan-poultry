; /etc/php/8.5/fpm/pool.d/janpoultry.conf
; Own pool = own Linux user, own sessions, own limits. Lux is untouched.
[janpoultry]
user  = janpoultry
group = janpoultry

listen       = /run/php/janpoultry.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; small VM (3.8 GB shared with Lux, MariaDB, Redis, NATS): keep this lean
pm                      = ondemand
pm.max_children         = 6
pm.process_idle_timeout = 20s
pm.max_requests         = 500

clear_env = yes

php_admin_value[open_basedir]          = /srv/http/janpoultry:/tmp:/var/lib/janpoultry
php_admin_value[session.save_path]     = /var/lib/janpoultry/sessions
php_admin_value[sys_temp_dir]          = /var/lib/janpoultry/tmp
php_admin_value[upload_tmp_dir]        = /var/lib/janpoultry/tmp
php_admin_value[upload_max_filesize]   = 100M
php_admin_value[post_max_size]         = 105M
php_admin_value[memory_limit]          = 256M
php_admin_value[max_execution_time]    = 60
php_admin_value[expose_php]            = Off
php_admin_flag[display_errors]         = off
php_admin_flag[allow_url_fopen]        = off
php_admin_flag[allow_url_include]      = off
; Phase D: once ffmpeg/mail move to workers, enable this line:
; php_admin_value[disable_functions]   = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec
