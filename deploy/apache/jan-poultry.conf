# ARCH dev:  /etc/httpd/conf/extra/jan-poultry.conf
# Serves ONLY /srv/http/jan-poultry/public on http://localhost:8080
Listen 8080

# The project folder lives under httpd's default DocumentRoot (/srv/http), so
# http://localhost/jan-poultry/ would expose .env, schema.sql, app/ ... Block it.
# Only the /public subfolder (below) is ever allowed.
<Directory "/srv/http/jan-poultry">
    Require all denied
</Directory>

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "/srv/http/jan-poultry/public"

    <Directory "/srv/http/jan-poultry/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  "/var/log/httpd/jan-poultry-error.log"
    CustomLog "/var/log/httpd/jan-poultry-access.log" combined
</VirtualHost>
